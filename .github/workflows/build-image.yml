name: 手动构建固件 (含失败调试)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '固件版本'
        required: true
        default: '24.10.5'
      target:
        description: '设备平台'
        required: true
        default: 'mediatek-filogic'
      profile:
        description: '配置文件'
        required: true
        default: 'cmcc_rax3000m'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境准备
        run: |
          sudo apt-get update
          sudo apt-get install -y wget zstd tar bash build-essential libncurses5-dev rsync python3

      - name: 执行构建脚本
        env:
          VERSION: ${{ github.event.inputs.version }}
          TARGET: ${{ github.event.inputs.target }}
          PROFILE: ${{ github.event.inputs.profile }}
        run: |
          chmod +x build-image.sh
          ./build-image.sh

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-${{ github.event.inputs.version }}
          path: bin/*.img.gz

      # 关键步骤：如果上方脚本失败，启动远程 SSH 调试
      - name: 进入远程调试模式 (仅限失败时)
        #if: failure()
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true # 仅允许触发者访问，更安全